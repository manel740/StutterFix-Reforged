plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()
}

repositories {
	mavenCentral()
	maven {
		name = 'MinecraftForge'
		url = 'https://maven.minecraftforge.net/'
	}
	maven {
		name = 'SpongePowered'
		url = 'https://repo.spongepowered.org/repository/maven-public/'
	}
}

minecraft {
	mappings channel: 'official', version: '1.20.1'

	copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				stutterfix {
					source sourceSets.main
				}
			}
		}

		server {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				stutterfix {
					source sourceSets.main
				}
			}
		}
	}
}

mixin {
	add sourceSets.main, 'stutterfix.refmap.json'
	config 'stutterfix.mixins.json'
}

dependencies {
	minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/mods.toml') {
		expand 'version': project.version
	}
}

jar {
	manifest {
		attributes([
				'Specification-Title'     : 'stutterfix',
				'Specification-Vendor'    : 'wisecase2',
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.archives_base_name,
				'Implementation-Version'  : project.version,
				'Implementation-Vendor'   : 'wisecase2',
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}

	finalizedBy 'reobfJar'
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
		}
	}
}